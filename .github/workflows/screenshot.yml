name: Homepage screenshot

# Renders index.html with headless Chromium and commits a full-page
# screenshot to .github/screenshot.png, which README.md embeds via a
# relative path (works for private repos too, unlike raw URLs).
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/screenshot.png"
      - "README.md"
  schedule:
    - cron: "0 0 * * 1" # every Monday 00:00 UTC (refreshes star badges etc.)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-screenshot
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Google Chrome (not Playwright's Chromium) so H.264 .mp4 thumbnails render.
      - name: Install Playwright + Google Chrome
        run: |
          npm install -g playwright@1.47.2
          playwright install --with-deps chrome

      - name: Render index.html and take a full-page screenshot
        run: NODE_PATH="$(npm root -g)" node .github/scripts/screenshot.cjs

      - name: Commit the screenshot if it changed
        run: |
          git add .github/screenshot.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update homepage screenshot [skip ci]"
          git pull --rebase -q origin main
          git push
